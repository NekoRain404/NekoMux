<?xml version="1.0" encoding="UTF-8"?>
<!--
  NekoMux launcher icon — the whole icon, background included.

  Used for the two places that cannot take an Android adaptive icon: the
  pre-Android-8 launcher bitmaps (`mipmap-*/ic_launcher.png`) and the store
  listing. Both want a finished square, so this file carries the surface the
  adaptive background layer carries on its own.

  The gradient is a slight lift towards the app's card colour (#182019) rather
  than a flat fill: a fully flat near-black square reads as a hole in a light
  launcher, and this keeps the top edge from disappearing into one.

  The mark is the same geometry as `icon_foreground.svg` — see that file for why
  every point sits inside the adaptive safe zone. Both are scaled together by
  `tool/generate_icons.sh`; do not hand-tune one without the other.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182019"/>
      <stop offset="1" stop-color="#0C110D"/>
    </linearGradient>
  </defs>

  <!-- The squircle. 24 of 108 is the ~22% corner radius Android's own icons
       use; the launcher applies its own mask on top for adaptive icons, so this
       shape only ever shows for the legacy bitmaps and the store. -->
  <rect x="0" y="0" width="108" height="108" rx="24" ry="24" fill="url(#bg)"/>

  <polygon points="30,46 30,28 46,46" fill="#8FBC8B"/>
  <polygon points="78,46 78,28 62,46" fill="#8FBC8B"/>
  <path d="M 33 57 L 46 67 L 33 77" fill="none" stroke="#8FBC8B"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="56" y="74" width="22" height="6" rx="3" fill="#82A6B1"/>
</svg>
