name: neko_mux
description: "NekoMux - All-in-One Server Management Tool. SSH, SFTP, monitoring."
publish_to: "none"
version: 2.0.0+2002

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Material's own strings — the About/license dialogs and the text-selection
  # toolbar over every field — come from here. Without it they stay English in
  # an app that ships eight languages; see lib/app.dart.
  # Material 自带文案——关于/许可对话框、每个输入框上的文本选择工具条——来自这里。
  # 没有它，一个发布八种语言的应用里这些文案全是英文；见 lib/app.dart。
  flutter_localizations:
    sdk: flutter
  fl_chart: ^0.66.2
  sqflite: ^2.4.2+1
  path: ^1.9.1
  uuid: ^4.5.3
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.3.0
  dartssh2: ^2.17.1
  xterm: ^4.0.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device verification of the real transfer path. Unit tests fake the
  # session; these run the shipped code against a real SSH server on the phone
  # itself — see integration_test/README.md.
  # 对真实传输路径的真机验证。单元测试伪造会话；这些测试在手机上针对真实的 SSH
  # 服务器运行随包发布的代码——见 integration_test/README.md。
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled typefaces. Declared here so the app never depends on reaching
  # fonts.gstatic.com at startup — see lib/core/theme/app_fonts.dart.
  # 随包分发的字体。在此声明，使应用启动时不再依赖能否连上 fonts.gstatic.com
  # ——见 lib/core/theme/app_fonts.dart。
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
